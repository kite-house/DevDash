{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Регистрация | IT-Кубок{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h2 class="text-center mb-4">📝 Регистрация</h2>
            <div class="card shadow-sm">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-success w-100 mt-3">
                            Зарегистрироваться
                        </button>
                    </form>
                    <div class="text-center mt-3">
                        Уже есть аккаунт?
                        <a href="{% url 'login' %}">Войти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    // Добавляем глазик для всех полей с паролем
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('input[type="password"]').forEach(function (input) {
            var wrapper = document.createElement('div');
            wrapper.className = 'position-relative';
            input.parentNode.insertBefore(wrapper, input);
            wrapper.appendChild(input);

            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn btn-sm btn-outline-secondary position-absolute top-50 end-0 translate-middle-y me-1 border-0';
            btn.innerHTML = '👁️';
            btn.style.zIndex = '10';
            wrapper.appendChild(btn);

            btn.addEventListener('click', function () {
                var type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                btn.innerHTML = type === 'password' ? '👁️' : '🙈';
            });
        });
    });
</script>
{% endblock %}
